[package]
  name    = "ether"
  version = "0.1.0"
  edition = "2024"

[profile.dev]
  opt-level   = 1
  incremental = true

  [profile.dev.packages."*"]
    opt-level = 3

[dependencies]
  serde  = { version = "1.0", features = ["derive"] }
  toml   = { version = "1.1.8" }
  blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
